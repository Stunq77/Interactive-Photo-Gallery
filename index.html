<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Photo Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Interactive Photo Gallery</h1>

    <!-- Khu vực hiển thị ảnh -->
    <div id="image">
        Hover over an image below to display here.
    </div>

    <!-- Các ảnh -->
    <div class="gallery">

        <img
            class="preview"
            src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
            alt="Beautiful mountain landscape"
            tabindex="0"
            onmouseover="upDate(this)"
            onmouseout="undo()"
            onfocus="upDate(this)"
            onblur="undo()"
        >

        <img
            class="preview"
            src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
            alt="Beautiful lake surrounded by mountains"
            tabindex="0"
            onmouseover="upDate(this)"
            onmouseout="undo()"
            onfocus="upDate(this)"
            onblur="undo()"
        >

        <img
            class="preview"
            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
            alt="Peaceful lake and mountain view"
            tabindex="0"
            onmouseover="upDate(this)"
            onmouseout="undo()"
            onfocus="upDate(this)"
            onblur="undo()"
        >

        <img
            class="preview"
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
            alt="Mountain landscape with trees"
            tabindex="0"
            onmouseover="upDate(this)"
            onmouseout="undo()"
            onfocus="upDate(this)"
            onblur="undo()"
        >

        <img
            class="preview"
            src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
            alt="Rocky mountain landscape"
            tabindex="0"
            onmouseover="upDate(this)"
            onmouseout="undo()"
            onfocus="upDate(this)"
            onblur="undo()"
        >

        <img
            class="preview"
            src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
            alt="Green forest"
            tabindex="0"
            onmouseover="upDate(this)"
            onmouseout="undo()"
            onfocus="upDate(this)"
            onblur="undo()"
        >

    </div>

    <script src="script.js"></script>

</body>

</html>
